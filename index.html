<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>招聘系统 · 简历管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f1f4f9;
            display: flex;
            min-height: 100vh;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 230px;
            background: #1a2332;
            color: #c8d0dc;
            padding: 24px 14px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #eef2f6;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 18px;
        }
        .sidebar-logo i {
            color: #5b8def;
            font-size: 22px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: 0.15s;
        }
        .nav-btn i {
            width: 18px;
            color: #64748b;
        }
        .nav-btn:hover {
            background: #2a3548;
            color: #eef2f6;
        }
        .nav-btn.active {
            background: #2a3548;
            color: #fff;
            font-weight: 600;
        }
        .nav-btn.active i {
            color: #5b8def;
        }
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .nav-badge {
            margin-left: auto;
            background: #2a3548;
            color: #94a3b8;
            font-size: 11px;
            padding: 1px 10px;
            border-radius: 30px;
        }
        .nav-btn.active .nav-badge {
            background: #3a4558;
            color: #c8d0dc;
        }

        /* ===== 主内容 ===== */
        .main-content {
            flex: 1;
            padding: 24px 32px 50px;
            max-width: 1360px;
            margin: 0 auto;
            width: 100%;
        }
        .page {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .category-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-title i {
            color: #2563eb;
        }
        .category-title small {
            font-weight: 400;
            font-size: 13px;
            color: #6b7280;
            background: #e9edf4;
            padding: 2px 12px;
            border-radius: 20px;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 7px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-sm {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-sm:hover {
            background: #1d4ed8;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #e2e6ed;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }
        .btn-success {
            background: #22c55e;
            border: none;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-danger {
            background: #ef4444;
            border: none;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        /* ===== 筛选区 ===== */
        .filter-section {
            background: #fff;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid #e5e9f0;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px 16px;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .filter-item label {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .filter-item select,
        .filter-item input {
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid #e2e6ed;
            background: #fafbfc;
            font-size: 13px;
            color: #111827;
            outline: none;
            width: 100%;
        }
        .filter-item select:focus,
        .filter-item input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .filter-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eef2f6;
        }
        .filter-actions .btn {
            background: transparent;
            border: 1px solid #e2e6ed;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .filter-actions .btn:hover {
            background: #f1f5f9;
        }

        /* ===== 卡片网格 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #eef2f6;
            transition: 0.2s;
            cursor: default;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
        }
        .card-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background: #eef2ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #2563eb;
        }
        .card-body {
            flex: 1;
            min-width: 0;
        }
        .card-title {
            font-weight: 600;
            color: #0f172a;
            font-size: 14px;
        }
        .card-desc {
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .empty-tip {
            color: #9ca3af;
            font-size: 14px;
            padding: 24px 0;
            text-align: center;
            grid-column: 1 / -1;
        }

        /* ===== 简历卡片（带状态） ===== */
        .resume-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px 18px;
            border-left: 4px solid #e5e9f0;
            transition: 0.2s;
            cursor: default;
            margin-bottom: 12px;
        }
        .resume-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .resume-card .resume-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }
        .resume-card .resume-name {
            font-weight: 600;
            font-size: 16px;
            color: #0f172a;
        }
        .resume-card .resume-contact {
            font-size: 13px;
            color: #6b7280;
        }
        .resume-card .resume-detail {
            font-size: 13px;
            color: #6b7280;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .resume-card .resume-detail span {
            background: #f1f4f9;
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 12px;
        }
        .resume-card .resume-stage {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eef2f6;
        }
        .stage-item {
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            border: 2px solid #e5e9f0;
            color: #9ca3af;
            background: #fafbfc;
        }
        .stage-item.active {
            border-color: #22c55e;
            color: #16a34a;
            background: #f0fdf4;
        }
        .stage-item.failed {
            border-color: #6b7280;
            color: #6b7280;
            background: #f3f4f6;
        }
        .resume-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eef2f6;
        }

        /* ===== 系统设置 ===== */
        .settings-section {
            background: #fff;
            border-radius: 14px;
            padding: 20px 24px;
            border: 1px solid #eef2f6;
        }
        .settings-section .setting-group {
            margin-bottom: 20px;
        }
        .settings-section .setting-group:last-child {
            margin-bottom: 0;
        }
        .settings-section .setting-label {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .settings-section .setting-label small {
            font-weight: 400;
            font-size: 12px;
            color: #9ca3af;
        }
        .settings-item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .settings-item {
            background: #f8fafc;
            border: 1px solid #e5e9f0;
            border-radius: 30px;
            padding: 5px 14px 5px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #1e293b;
        }
        .settings-item .del-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 20px;
            transition: 0.15s;
        }
        .settings-item .del-btn:hover {
            color: #ef4444;
            background: #fee2e2;
        }
        .dept-add-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .dept-add-row input {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #e2e6ed;
            font-size: 13px;
            color: #111827;
            outline: none;
            min-width: 160px;
            flex: 1;
            background: #fafbfc;
            transition: 0.15s;
        }
        .dept-add-row input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .dept-add-row .btn-add {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .dept-add-row .btn-add:hover {
            background: #1d4ed8;
        }

        /* ===== 权限横幅 ===== */
        .lock-banner {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .lock-banner .lock-text {
            font-size: 13px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lock-banner .unlock-btn {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .lock-banner .unlock-btn:hover {
            background: #1d4ed8;
        }
        .lock-banner .locked-badge {
            background: #ef4444;
            color: #fff;
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }
        .lock-banner .unlocked-badge {
            background: #22c55e;
            color: #fff;
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }
        .modal h3 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 3px;
        }
        .modal .form-group label .required {
            color: #ef4444;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #e2e6ed;
            font-size: 13px;
            color: #111827;
            outline: none;
            background: #fafbfc;
            transition: 0.15s;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }
        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
        .modal-actions .btn {
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: 0.15s;
        }
        .modal-actions .btn-outline {
            background: transparent;
            border: 1px solid #e2e6ed;
            color: #374151;
        }
        .modal-actions .btn-outline:hover {
            background: #f1f5f9;
        }
        .modal-actions .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .modal-actions .btn-primary:hover {
            background: #1d4ed8;
        }
        .modal .upload-area {
            border: 2px dashed #e2e6ed;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fafbfc;
        }
        .modal .upload-area:hover {
            border-color: #2563eb;
            background: #f0f4ff;
        }
        .modal .upload-area i {
            font-size: 32px;
            color: #9ca3af;
            margin-bottom: 8px;
            display: block;
        }
        .modal .upload-area p {
            color: #6b7280;
            font-size: 14px;
        }
        .modal .upload-area .hint {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 4px;
        }

        /* ===== 密码弹窗 ===== */
        .password-modal .modal {
            max-width: 360px;
        }
        .password-modal .form-group input {
            text-align: center;
            font-size: 18px;
            letter-spacing: 6px;
            padding: 10px;
        }
        .password-modal .form-group .hint {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            margin-top: 4px;
        }

        /* ===== 移动端 ===== */
        .hamburger {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 1100;
            background: #1a2332;
            border: none;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            color: #eef2f6;
            font-size: 18px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        @media (max-width: 820px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-110%);
                width: 260px;
                height: 100vh;
                z-index: 1000;
                transition: transform 0.3s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger {
                display: flex !important;
            }
            .overlay.active {
                display: block !important;
            }
            .main-content {
                padding: 20px 16px 30px;
            }
            .filter-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            .modal .form-row,
            .modal .form-row-3 {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 480px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }
            .card-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .category-title {
                font-size: 18px;
            }
            .modal {
                padding: 16px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 移动端组件 ===== -->
    <div class="overlay" id="overlay"></div>
    <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>

    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><i class="fas fa-building"></i><span>招聘系统</span></div>
        <nav class="nav-menu" id="navMenu"></nav>
    </aside>

    <!-- ===== 主内容 ===== -->
    <main class="main-content" id="mainContent">
        <div id="contentContainer"></div>
    </main>

    <!-- ===== 上传简历弹窗 ===== -->
    <div class="modal-overlay" id="resumeModal">
        <div class="modal">
            <h3><i class="fas fa-file-upload" style="color:#2563eb;"></i> 上传简历</h3>
            <div class="form-group">
                <label>上传简历文件 <span class="required">*</span></label>
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>点击上传或拖拽简历文件</p>
                    <div class="hint">支持 .doc, .docx, .pdf 格式</div>
                    <input type="file" id="resumeFileInput" accept=".doc,.docx,.pdf" style="display:none;" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>姓名 <span class="required">*</span></label>
                    <input type="text" id="resumeName" placeholder="自动识别" />
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select id="resumeGender">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>年龄</label>
                    <input type="number" id="resumeAge" placeholder="自动识别" />
                </div>
                <div class="form-group">
                    <label>工作经验（年）</label>
                    <input type="number" id="resumeExperience" placeholder="自动识别" step="0.5" />
                </div>
            </div>
            <div class="form-group">
                <label>联系方式 <span class="required">*</span></label>

        // ============================================================
        // 简历操作函数
        // ============================================================

        // 推进阶段
        function advanceStage(contact) {
            var c = candidates[contact];
            if (!c) return;
            var currentIdx = STAGES.indexOf(c.stage);
            if (currentIdx < STAGES.length - 1) {
                c.stage = STAGES[currentIdx + 1];
                // 如果进入面试阶段，记录面试官
                if (c.stage.indexOf('进入') === 0) {
                    var round = c.stage.replace('进入', '').replace('面', '');
                    // 这里可关联面试官配置
                }
                renderResumeList();
                renderTalentList();
                renderNavigation();
            } else {
                alert('已到达最终阶段：' + c.stage);
            }
        }

        // 淘汰（失败）
        function failStage(contact) {
            var c = candidates[contact];
            if (!c) return;
            if (confirm('确定要淘汰候选人「' + c.name + '」吗？')) {
                // 将当前阶段标记为失败，但不推进到下一阶段
                // 我们移除该候选人，或标记为淘汰
                // 这里简单处理：从列表中移除
                delete candidates[contact];
                candidateList = candidateList.filter(function(item) {
                    return item.contact !== contact;
                });
                renderResumeList();
                renderTalentList();
                renderNavigation();
            }
        }

        // 查看简历详情
        function viewResume(contact) {
            var c = candidates[contact];
            if (!c) return;
            alert(
                '📄 简历详情\n\n' +
                '姓名：' + c.name + '\n' +
                '性别：' + c.gender + '\n' +
                '年龄：' + c.age + '岁\n' +
                '工作经验：' + c.experience + '年\n' +
                '联系方式：' + c.contact + '\n' +
                '推荐岗位：' + c.jobTitle + '\n' +
                '来源：' + c.source + '\n' +
                '当前阶段：' + c.stage + '\n' +
                '曾任职本公司：' + c.formerEmployee + '\n' +
                '可回流：' + c.rehire + '\n\n' +
                '工作经历：\n' + (c.workExp || '无') + '\n\n' +
                '实习经历：\n' + (c.internExp || '无')
            );
        }

        // ============================================================
        // 系统设置页面
        // ============================================================
        function renderSettingsPage() {
            var page = document.querySelector('.page[data-page="settings"]');
            if (!page) return;
            var html = '';
            html += '<div class="category-header">';
            html += '<h2 class="category-title"><i class="fas fa-cog"></i> 系统设置 <small>管理</small></h2>';
            html += '</div>';
            html += '<div class="settings-section">';

            var lockIcon = isAdmin ? 'fa-unlock' : 'fa-lock';
            var badgeCls = isAdmin ? 'unlocked-badge' : 'locked-badge';
            var badgeTxt = isAdmin ? '已解锁' : '已锁定';
            var statusTxt = isAdmin ? '✅ 您拥有管理权限' : '🔒 需要管理员密码才能编辑';
            var btnIcon = isAdmin ? 'fa-lock' : 'fa-key';
            var btnTxt = isAdmin ? '锁定' : '解锁';

            html += '<div class="lock-banner" id="lockBanner">';
            html += '<div class="lock-text"><i class="fas ' + lockIcon + '"></i> 当前状态：<span class="' + badgeCls + '">' + badgeTxt +
                '</span> ' + statusTxt + '</div>';
            html += '<button class="unlock-btn" id="toggleAdminBtn"><i class="fas ' + btnIcon + '"></i> ' + btnTxt + '</button>';
            html += '</div>';

            html += '<div class="setting-group">';
            html += '<div class="setting-label">';
            html += '<span><i class="fas fa-building" style="color:#2563eb;"></i> 所属部门管理 <small>' + (isAdmin ? '（可编辑）' :
                    '（只读）') + '</small></span>';
            if (isAdmin) {
                html += '<button class="btn-sm" id="showDeptAddBtn"><i class="fas fa-plus"></i> 添加部门</button>';
            }
            html += '</div>';
            html += '<div class="settings-item-list" id="deptList">';
            for (var k = 0; k < departments.length; k++) {
                var d = departments[k];
                html += '<div class="settings-item">' + d;
                if (isAdmin) {
                    html += '<button class="del-btn" data-dept="' + d + '"><i class="fas fa-times"></i></button>';
                }
                html += '</div>';
            }
            html += '</div>';
            if (isAdmin) {
                html += '<div class="dept-add-row" id="deptAddRow">';
                html += '<input type="text" id="newDeptInput" placeholder="输入新部门名称..." />';
                html += '<button class="btn-add" id="addDeptBtn"><i class="fas fa-plus"></i> 添加</button>';
                html += '</div>';
            }
            html += '</div></div></div>';
            page.innerHTML = html;

            document.getElementById('toggleAdminBtn').addEventListener('click', toggleAdmin);

            var showDeptAddBtn = document.getElementById('showDeptAddBtn');
            if (showDeptAddBtn) {
                showDeptAddBtn.addEventListener('click', function() {
                    var row = document.getElementById('deptAddRow');
                    if (row) {
                        row.style.display = row.style.display === 'none' ? 'flex' : 'none';
                        if (row.style.display === 'flex') {
                            document.getElementById('newDeptInput').focus();
                        }
                    }
                });
            }

            var delBtns = document.querySelectorAll('.del-btn');
            for (var db = 0; db < delBtns.length; db++) {
                delBtns[db].addEventListener('click', function() {
                    if (!isAdmin) return;
                    var deptName = this.dataset.dept;
                    if (confirm('确定要删除部门「' + deptName + '」吗？')) {
                        var newDepts = [];
                        for (var idx = 0; idx < departments.length; idx++) {
                            if (departments[idx] !== deptName) newDepts.push(departments[idx]);
                        }
                        departments = newDepts;
                        renderSettingsPage();
                        updateAllDeptSelects();
                    }
                });
            }

            var addDeptBtn = document.getElementById('addDeptBtn');
            if (addDeptBtn) {
                addDeptBtn.addEventListener('click', function() {
                    if (!isAdmin) return;
                    var input = document.getElementById('newDeptInput');
                    var name = input.value.trim();
                    if (!name) { alert('请输入部门名称'); return; }
                    for (var i = 0; i < departments.length; i++) {
                        if (departments[i] === name) { alert('该部门已存在'); return; }
                    }
                    departments.push(name);
                    input.value = '';
                    renderSettingsPage();
                    updateAllDeptSelects();
                });
            }

            var newDeptInput = document.getElementById('newDeptInput');
            if (newDeptInput) {
                newDeptInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        var btn = document.getElementById('addDeptBtn');
                        if (btn) btn.click();
                    }
                });
            }
        }

        // ============================================================
        // 工具函数
        // ============================================================
        function updateAllDeptSelects() {
            var jobDept = document.getElementById('jobDept');
            if (jobDept) renderDeptOptions(jobDept);
        }

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                renderSettingsPage();
                renderNavigation();
            } else {
                passwordModal.classList.add('active');
                adminPasswordInput.value = '';
                adminPasswordInput.focus();
            }
        }

        // ============================================================
        // 弹窗事件
        // ============================================================
        modalCancel.addEventListener('click', function() { modalOverlay.classList.remove('active'); });

        modalConfirm.addEventListener('click', function() {
            var name = document.getElementById('resumeName').value.trim();
            var gender = document.getElementById('resumeGender').value;
            var age = parseInt(document.getElementById('resumeAge').value);
            var experience = parseFloat(document.getElementById('resumeExperience').value);
            var contact = document.getElementById('resumeContact').value.trim();
            var workExp = document.getElementById('resumeWorkExp').value.trim();
            var internExp = document.getElementById('resumeInternExp').value.trim();
            var formerEmployee = document.getElementById('resumeFormerEmployee').value;
            var rehire = document.getElementById('resumeRehire').value;
            var source = document.getElementById('resumeSource').value;
            var jobTitle = document.getElementById('resumeJob').value;

            if (!name) { alert('请输入姓名'); return; }
            if (!contact) { alert('请输入联系方式'); return; }
            if (!jobTitle) { alert('请选择推荐岗位'); return; }

            // 检查是否已存在相同联系方式的候选人
            if (candidates[contact]) {
                if (!confirm('已存在相同联系方式的候选人「' + candidates[contact].name + '」，是否覆盖更新？')) return;
            }

            var candidateData = {
                name: name,
                gender: gender || '未知',
                age: age || 0,
                experience: experience || 0,
                contact: contact,
                workExp: workExp,
                internExp: internExp,
                formerEmployee: formerEmployee,
                rehire: rehire,
                source: source,
                jobTitle: jobTitle,
                stage: '筛选中' // 默认状态
            };

            // 保存或更新
            if (candidates[contact]) {
                // 保留原阶段，覆盖其他信息
                candidateData.stage = candidates[contact].stage;
                // 移除旧记录
                candidateList = candidateList.filter(function(c) { return c.contact !== contact; });
            }
            candidates[contact] = candidateData;
            candidateList.push(candidateData);

            modalOverlay.classList.remove('active');
            renderResumeList();
            renderTalentList();
            renderNavigation();
            alert('✅ 简历上传成功！\n候选人：' + name + '\n岗位：' + jobTitle + '\n当前状态：筛选中');
        });

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) modalOverlay.classList.remove('active');
        });

        // 文件上传拖拽
        uploadArea.addEventListener('click', function() {
            resumeFileInput.click();
        });

        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#2563eb';
            this.style.background = '#f0f4ff';
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#e2e6ed';
            this.style.background = '#fafbfc';
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#e2e6ed';
            this.style.background = '#fafbfc';
            var files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileUpload(files[0]);
            }
        });

        resumeFileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                handleFileUpload(this.files[0]);
            }
        });

        function handleFileUpload(file) {
            var ext = file.name.split('.').pop().toLowerCase();
            if (!['doc', 'docx', 'pdf'].includes(ext)) {
                alert('请上传 .doc, .docx 或 .pdf 格式的文件');
                return;
            }
            // 模拟解析（实际需调用后端API）
            var parsed = parseResume(file);
            document.getElementById('resumeName').value = parsed.name || '';
            document.getElementById('resumeGender').value = parsed.gender || '';
            document.getElementById('resumeAge').value = parsed.age || '';
            document.getElementById('resumeExperience').value = parsed.experience || '';
            document.getElementById('resumeContact').value = parsed.contact || '';
            document.getElementById('resumeWorkExp').value = parsed.workExp || '';
            document.getElementById('resumeInternExp').value = parsed.internExp || '';
            document.getElementById('resumeFormerEmployee').value = parsed.formerEmployee || '否';
            document.getElementById('resumeRehire').value = parsed.rehire || '是';
            alert('✅ 简历解析完成！请检查并补充信息。');
        }

        // ============================================================
        // 密码验证
        // ============================================================
        passwordCancel.addEventListener('click', function() { passwordModal.classList.remove('active'); });
        passwordConfirm.addEventListener('click', function() {
            if (adminPasswordInput.value.trim() === ADMIN_PASSWORD) {
                isAdmin = true;
                passwordModal.classList.remove('active');
                renderSettingsPage();
                renderNavigation();
            } else {
                alert('密码错误，请重试');
                adminPasswordInput.value = '';
                adminPasswordInput.focus();
            }
        });
        adminPasswordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') passwordConfirm.click();
        });
        passwordModal.addEventListener('click', function(e) {
            if (e.target === passwordModal) passwordModal.classList.remove('active');
        });

        // ============================================================
        // 新增职位（简化版）
        // ============================================================
        function addNewJob() {
            var title = document.getElementById('jobTitle').value.trim();
            var dept = document.getElementById('jobDept').value;
            var hc = document.getElementById('jobHC').value.trim();
            var manager = document.getElementById('jobManager').value.trim();
            var date = document.getElementById('jobDate').value;
            var status = document.getElementById('jobStatus').value;

            if (!title) { alert('请输入职位名称'); return; }

            var hcText = hc ? ' · HC:' + hc : '';
            var newCard = {
                title: title,
                desc: dept + ' · ' + (date || '近期') + ' · ' + status + hcText,
                icon: 'fa-briefcase'
            };
            jobCards.push(newCard);

            // 关闭弹窗
            document.getElementById('jobModalOverlay').classList.remove('active');
            renderJobsPage();
            renderNavigation();
        }

        // ============================================================
        // 移动端菜单
        // ============================================================
        function openMobileMenu() { sidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden'; }

        function closeMobileMenu() { sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = ''; }

        hamburgerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            sidebar.classList.contains('open') ? closeMobileMenu() : openMobileMenu();
        });
        overlay.addEventListener('click', closeMobileMenu);
        navMenu.addEventListener('click', function() { if (window.innerWidth <= 820) setTimeout(closeMobileMenu, 120); });
        window.addEventListener('resize', function() { if (window.innerWidth > 820 && sidebar.classList.contains('open'))
                closeMobileMenu(); });

        // ============================================================
        // 初始化
        // ============================================================

        // 创建页面容器
        contentContainer.innerHTML = '';
        for (var i = 0; i < categories.length; i++) {
            var pageDiv = document.createElement('div');
            pageDiv.className = 'page' + (categories[i].id === currentPage ? ' active' : '');
            pageDiv.dataset.page = categories[i].id;
            pageDiv.id = 'page-' + categories[i].id;
            contentContainer.appendChild(pageDiv);
        }

        // 添加新增职位弹窗（在页面底部）
        var jobModalHTML = `
        <div class="modal-overlay" id="jobModalOverlay">
          <div class="modal">
            <h3><i class="fas fa-briefcase" style="color:#2563eb;"></i> 新增职位</h3>
            <div class="form-group"><label>职位名称 *</label><input type="text" id="jobTitle" placeholder="例如：前端开发工程师" /></div>
            <div class="form-group"><label>岗位职责</label><textarea id="jobDuty" placeholder="描述岗位核心职责..."></textarea></div>
            <div class="form-row">
              <div class="form-group"><label>所属部门 *</label><select id="jobDept"></select></div>
              <div class="form-group"><label>HC（人数）</label><input type="number" id="jobHC" placeholder="例如：3" min="1" /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>用人经理</label><input type="text" id="jobManager" placeholder="输入人员名称" /></div>
              <div class="form-group"><label>职位开设时间</label><input type="date" id="jobDate" /></div>
            </div>
            <div class="form-group">
              <label>职位状态</label>
              <select id="jobStatus"><option value="招聘中" selected>招聘中</option><option value="招聘截止">招聘截止</option></select>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" id="jobModalCancel">取消</button>
              <button class="btn btn-primary" id="jobModalConfirm">确认新增</button>
            </div>
          </div>
        </div>
        `;
        document.body.insertAdjacentHTML('beforeend', jobModalHTML);

        document.getElementById('jobModalCancel').addEventListener('click', function() {
            document.getElementById('jobModalOverlay').classList.remove('active');
        });
        document.getElementById('jobModalConfirm').addEventListener('click', addNewJob);
        document.getElementById('jobModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        // 暴露全局函数
        window.uploadResumeForJob = uploadResumeForJob;
        window.configureInterview = configureInterview;
        window.advanceStage = advanceStage;
        window.failStage = failStage;
        window.viewResume = viewResume;

        renderNavigation();

        // 初始化各页面
        var initialPage = document.querySelector('.page[data-page="' + currentPage + '"]');
        if (initialPage) initialPage.classList.add('active');

        renderJobsPage();
        renderTalentPage();
        renderResumesPage();
        renderSettingsPage();

        // 初始化部门下拉
        renderDeptOptions(document.getElementById('jobDept'));
    </script>
</body>
</html>
