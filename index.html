<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>招聘系统</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background: #f4f6fa;
      display: flex;
      min-height: 100vh;
    }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      width: 240px;
      background: #1e293b;
      color: #e2e8f0;
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      color: #f1f5f9;
    }
    .sidebar-logo i {
      color: #60a5fa;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: 0.2s;
    }
    .nav-btn i {
      width: 20px;
      color: #64748b;
    }
    .nav-btn:hover {
      background: #334155;
      color: #f1f5f9;
    }
    .nav-btn.active {
      background: #334155;
      color: #f1f5f9;
      font-weight: 600;
    }
    .nav-btn.active i {
      color: #60a5fa;
    }
    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    /* ---------- 右侧主区域 ---------- */
    .main-content {
      flex: 1;
      padding: 28px 40px 60px;
      max-width: 1360px;
      margin: 0 auto;
    }

    /* ---------- 分类标题 ---------- */
    .category-block {
      margin-bottom: 48px;
      scroll-margin-top: 20px;
    }
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .category-title {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .category-title i {
      color: #2563eb;
    }
    .category-title small {
      font-weight: 400;
      font-size: 14px;
      color: #64748b;
      background: #e9edf4;
      padding: 2px 14px;
      border-radius: 30px;
    }

    /* ---------- 按钮 ---------- */
    .btn-primary {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #d1d5db;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }

    /* ---------- 筛选区 ---------- */
    .filter-section {
      background: #fff;
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 24px;
      border: 1px solid #eef2f6;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px 20px;
    }
    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-item label {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .filter-item select,
    .filter-item input {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #fafbfc;
      font-size: 14px;
      color: #111827;
      outline: none;
      width: 100%;
    }
    .filter-item select:focus,
    .filter-item input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }
    .filter-date-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .filter-date-group input {
      flex: 1;
    }
    .filter-date-group span {
      color: #9ca3af;
      font-size: 13px;
    }
    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #f0f2f5;
    }
    .filter-actions .btn {
      background: transparent;
      border: 1px solid #e5e7eb;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .filter-actions .btn:hover {
      background: #f1f5f9;
    }

    /* ---------- 卡片网格 ---------- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid #eef2f6;
      transition: 0.2s;
      cursor: default;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      border-color: #d1d9e6;
    }
    .card-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: #eef2ff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #2563eb;
    }
    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-weight: 600;
      color: #0f172a;
      font-size: 15px;
      margin-bottom: 2px;
    }
    .card-desc {
      font-size: 13px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-tip {
      color: #9ca3af;
      font-size: 15px;
      padding: 30px 0;
      text-align: center;
      grid-column: 1 / -1;
    }

    /* ---------- 系统设置 ---------- */
    .settings-section {
      background: #fff;
      border-radius: 20px;
      padding: 24px 28px;
      border: 1px solid #eef2f6;
    }
    .settings-section .setting-group {
      margin-bottom: 20px;
    }
    .settings-section .setting-group:last-child {
      margin-bottom: 0;
    }
    .settings-section .setting-label {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-section
