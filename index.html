<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>招聘系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f1f4f9;
            display: flex;
            min-height: 100vh;
        }

        /* ===== 左侧导航 ===== */
        .sidebar {
            width: 240px;
            background: #1a2332;
            color: #c8d0dc;
            padding: 28px 16px 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #eef2f6;
            padding: 0 8px 28px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
        }
        .sidebar-logo i {
            color: #5b8def;
            font-size: 24px;
        }
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: 0.15s;
        }
        .nav-btn i {
            width: 20px;
            font-size: 16px;
            color: #64748b;
        }
        .nav-btn:hover {
            background: #2a3548;
            color: #eef2f6;
        }
        .nav-btn.active {
            background: #2a3548;
            color: #ffffff;
            font-weight: 600;
        }
        .nav-btn.active i {
            color: #5b8def;
        }

        /* ===== 移动端菜单 ===== */
        .hamburger {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1100;
            background: #1a2332;
            border: none;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            color: #eef2f6;
            font-size: 20px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        /* ===== 右侧主内容 ===== */
        .main-content {
            flex: 1;
            padding: 28px 36px 60px;
            max-width: 1360px;
            margin: 0 auto;
            width: 100%;
        }
        .category-block {
            margin-bottom: 48px;
            scroll-margin-top: 16px;
        }
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .category-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-title i {
            color: #2563eb;
        }
        .category-title small {
            font-weight: 400;
            font-size: 14px;
            color: #6b7280;
            background: #e9edf4;
            padding: 2px 14px;
            border-radius: 20px;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }

        /* ===== 筛选区 ===== */
        .filter-section {
            background: #fff;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid #e5e9f0;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 14px 18px;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-item label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .filter-item select,
        .filter-item input {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #e2e6ed;
            background: #fafbfc;
            font-size: 14px;
            color: #111827;
            outline: none;
            width: 100%;
            transition: 0.15s;
        }
        .filter-item select:focus,
        .filter-item input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .filter-date-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .filter-date-group input {
            flex: 1;
        }
        .filter-date-group span {
            color: #9ca3af;
            font-size: 13px;
        }
        .filter-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #eef2f6;
        }
        .filter-actions .btn {
            background: transparent;
            border: 1px solid #e2e6ed;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
        }
        .filter-actions .btn:hover {
            background: #f1f5f9;
        }

        /* ===== 卡片 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #eef2f6;
            transition: 0.2s;
            cursor: default;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            border-color: #d1d9e6;
        }
        .card-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;
            background: #eef2ff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #2563eb;
        }
        .card-body {
            flex: 1;
            min-width: 0;
        }
        .card-title {
            font-weight: 600;
            color: #0f172a;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .card-desc {
            font-size: 13px;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .empty-tip {
            color: #9ca3af;
            font-size: 15px;
            padding: 30px 0;
            text-align: center;
            grid-column: 1 / -1;
        }

        /* ===== 系统设置 ===== */
        .settings-section {
            background: #fff;
            border-radius: 16px;
            padding: 24px 28px;
            border: 1px solid #eef2f6;
        }
        .settings-section .setting-group {
            margin-bottom: 20px;
        }
        .settings-section .setting-group:last-child {
            margin-bottom: 0;
        }
        .settings-section .setting-label {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-section .setting-label small {
            font-weight: 400;
            font-size: 13px;
            color: #9ca3af;
        }
        .settings-item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .settings-item {
            background: #f8fafc;
            border: 1px solid #e5e9f0;
            border-radius: 30px;
            padding: 6px 16px 6px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #1e293b;
        }
        .settings-item .del-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 20px;
            transition: 0.15s;
        }
        .settings-item .del-btn:hover {
            color: #ef4444;
            background: #fee2e2;
        }
        .settings-add-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .settings-add-row input {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #e2e6ed;
            font-size: 14px;
            color: #111827;
            outline: none;
            min-width: 180px;
            flex: 1;
            transition: 0.15s;
        }
        .settings-add-row input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .settings-add-row .btn-add {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .settings-add-row .btn-add:hover {
            background: #1d4ed8;
        }

        /* ===== 权限横幅 ===== */
        .lock-banner {
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .lock-banner .lock-text {
            font-size: 14px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lock-banner .unlock-btn {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .lock-banner .unlock-btn:hover {
            background: #1d4ed8;
        }
        .lock-banner .locked-badge {
            background: #ef4444;
            color: #fff;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .lock-banner .unlocked-badge {
            background: #22c55e;
            color: #fff;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px 36px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
        }
        .modal h3 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #e2e6ed;
            font-size: 14px;
            color: #111827;
            outline: none;
            transition: 0.15s;
            background: #fafbfc;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }
        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }
        .modal-actions .btn {
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: 0.15s;
        }
        .modal-actions .btn-outline {
            background: transparent;
            border: 1px solid #e2e6ed;
            color: #374151;
        }
        .modal-actions .btn-outline:hover {
            background: #f1f5f9;
        }
        .modal-actions .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .modal-actions .btn-primary:hover {
            background: #1d4ed8;
        }

        /* ===== 密码弹窗 ===== */
        .password-modal .modal {
            max-width: 400px;
        }
        .password-modal .form-group input {
            text-align: center;
            font-size: 18px;
            letter-spacing: 6px;
            padding: 12px;
        }
        .password-modal .form-group .hint {
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            margin-top: 6px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-110%);
                width: 280px;
                height: 100vh;
                z-index: 1000;
                transition: transform 0.3s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger {
                display: flex;
            }
            .overlay.active {
                display: block;
            }
            .main-content {
                padding: 28px 18px 40px;
            }
            .filter-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 12px;
            }
            .modal .form-row {
                grid-template-columns: 1fr;
            }
            .settings-add-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
        @media (max-width: 480px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }
            .card-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .card {
                padding: 12px 14px;
                gap: 10px;
            }
            .card-icon {
                width: 36px;
                height: 36px;
                min-width: 36px;
                font-size: 16px;
            }
            .category-title {
                font-size: 20px;
            }
            .modal {
                padding: 20px 18px;
            }
            .filter-section {
                padding: 14px 16px;
            }
            .settings-section {
                padding: 16px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- 移动端遮罩 -->
    <div class="overlay" id="overlay"></div>

    <!-- 汉堡菜单 -->
    <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>

    <!-- ===== 侧边栏 ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-building"></i>
            <span>招聘系统</span>
        </div>
        <nav class="nav-menu" id="navMenu"></nav>
    </aside>

    <!-- ===== 主内容 ===== -->
    <main class="main-content" id="mainContent">
        <div id="contentContainer"></div>
    </main>

    <!-- ===== 新增职位弹窗 ===== -->
    <div class="modal-overlay" id="jobModal">
        <div class="modal">
            <h3><i class="fas fa-briefcase" style="color:#2563eb;"></i> 新增职位</h3>
            <div class="form-group">
                <label>职位名称 *</label>
                <input type="text" id="jobTitle" placeholder="例如：前端开发工程师" />
            </div>
            <div class="form-group">
                <label>岗位职责</label>
                <textarea id="jobDuty" placeholder="描述岗位核心职责..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>所属部门 *</label>
                    <select id="jobDept"></select>
                </div>
                <div class="form-group">
                    <label>用人经理</label>
                    <input type="text" id="jobManager" placeholder="输入人员名称" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>职位开设时间</label>
                    <input type="date" id="jobDate" />
                </div>
                <div class="form-group">
                    <label>职位状态</label>
                    <select id="jobStatus">
                        <option value="招聘中" selected>招聘中</option>
                        <option value="招聘截止">招聘截止</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalCancel">取消</button>
                <button class="btn btn-primary" id="modalConfirm">确认新增</button>
            </div>
        </div>
    </div>

    <!-- ===== 密码验证弹窗 ===== -->
    <div class="modal-overlay password-modal" id="passwordModal">
        <div class="modal">
            <h3><i class="fas fa-lock" style="color:#f59e0b;"></i> 权限验证</h3>
            <div class="form-group">
                <label>请输入管理员密码</label>
                <input type="password" id="adminPassword" placeholder="请输入密码" />
                <div class="hint">默认密码：admin123</div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="passwordCancel">取消</button>
                <button class="btn btn-primary" id="passwordConfirm">验证</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 数据
        // ============================================================
        let jobCards = [];
        let talentCards = [];
        let departments = ['硬件研发部', '软件研发部', '经营管理部', '市场部', '品牌与体验部', '产品部'];
        let isAdmin = false;
        const ADMIN_PASSWORD = 'admin123';

        const categories = [
            { id: 'jobs', label: '职位管理', icon: 'fa-briefcase' },
            { id: 'talent', label: '人才库', icon: 'fa-users' },
            { id: 'settings', label: '系统设置', icon: 'fa-cog' }
        ];

        // ============================================================
        // DOM 引用
        // ============================================================
        const navMenu = document.getElementById('navMenu');
        const contentContainer = document.getElementById('contentContainer');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const modalOverlay = document.getElementById('jobModal');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');
        const passwordModal = document.getElementById('passwordModal');
        const passwordCancel = document.getElementById('passwordCancel');
        const passwordConfirm = document.getElementById('passwordConfirm');
        const adminPasswordInput = document.getElementById('adminPassword');

        // ============================================================
        // 渲染函数
        // ============================================================

        // 渲染导航
        function renderNavigation() {
            navMenu.innerHTML = '';
            categories.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn' + (idx === 0 ? ' active' : '');
                btn.dataset.target = cat.id;
                btn.innerHTML = '<i class="fas ' + cat.icon + '"></i> ' + cat.label;
                btn.addEventListener('click', function() {
                    scrollToCategory(cat.id);
                    closeMobileMenu();
                });
                navMenu.appendChild(btn);
            });
        }

        // 渲染部门下拉选项
        function renderDeptOptions(selectEl) {
            if (!selectEl) return;
            selectEl.innerHTML = '';
            departments.forEach(function(dept) {
                var opt = document.createElement('option');
                opt.value = dept;
                opt.textContent = dept;
                selectEl.appendChild(opt);
            });
        }

        // 渲染主内容
        function renderContent() {
            var html = '';

            // ---- 职位管理 ----
            html += '<section class="category-block" id="section-jobs" data-category="jobs">';
            html += '<div class="category-header">';
            html += '<h2 class="category-title"><i class="fas fa-briefcase"></i> 职位管理 <small>分类</small></h2>';
            html += '<button class="btn-primary" id="addJobBtn"><i class="fas fa-plus"></i> 新增职位</button>';
            html += '</div>';
            html += '<div class="card-grid" id="jobCardGrid">';
            if (jobCards.length === 0) {
                html += '<div class="empty-tip">暂无职位，点击「新增职位」添加</div>';
            } else {
                for (var i = 0; i < jobCards.length; i++) {
                    var card = jobCards[i];
                    html += '<div class="card">';
                    html += '<div class="card-icon"><i class="fas ' + card.icon + '"></i></div>';
                    html += '<div class="card-body">';
                    html += '<div class="card-title">' + card.title + '</div>';
                    html += '<div class="card-desc">' + card.desc + '</div>';
                    html += '</div></div>';
                }
            }
            html += '</div></section>';

            // ---- 人才库 ----
            html += '<section class="category-block" id="section-talent" data-category="talent">';
            html += '<div class="category-header">';
            html += '<h2 class="category-title"><i class="fas fa-users"></i> 人才库 <small>分类</small></h2>';
            html += '</div>';
            html += '<div class="filter-section" id="talentFilter">';
            html += '<div class="filter-grid">';
            html += '<div class="filter-item"><label>应聘职位</label><input type="text" id="filterPosition" placeholder="输入职位关键词" /></div>';
            html += '<div class="filter-item"><label>候选人姓名</label><input type="text" id="filterName" placeholder="输入姓名关键词" /></div>';
            html += '<div class="filter-item"><label>最高学历</label><select id="filterDegree"><option value="all">全部</option><option value="大专">大专</option><option value="本科">本科</option><option value="硕士">硕士</option><option value="博士">博士</option></select></div>';
            html += '<div class="filter-item"><label>工作年限</label><select id="filterExperience"><option value="all">全部</option><option value="应届生">应届生</option><option value="1-3年">1-3年</option><option value="3-5年">3-5年</option><option value="5-10年">5-10年</option><option value="10年以上">10年以上</option></select></div>';
            html += '<div class="filter-item"><label>当前状态</label><select id="filterStatus"><option value="all">全部</option><option value="在职">在职</option><option value="离职">离职</option><option value="待业">待业</option></select></div>';
            html += '<div class="filter-item"><label>来源渠道</label><select id="filterSource"><option value="all">全部</option><option value="内推">内推</option><option value="官方网站">官方网站</option><option value="boss">boss</option><option value="猎头">猎头</option><option value="小红书">小红书</option></select></div>';
            html += '<div class="filter-item"><label>投递日期</label><div class="filter-date-group"><input type="date" id="filterDateStart" /><span>至</span><input type="date" id="filterDateEnd" /></div></div>';
            html += '</div>';
            html += '<div class="filter-actions">';
            html += '<button class="btn" id="filterApplyBtn"><i class="fas fa-search"></i> 筛选</button>';
            html += '<button class="btn" id="filterResetBtn"><i class="fas fa-undo"></i> 重置</button>';
            html += '</div></div>';
            html += '<div class="card-grid" id="talentCardGrid">';
            if (talentCards.length === 0) {
                html += '<div class="empty-tip">暂无候选人</div>';
            } else {
                for (var j = 0; j < talentCards.length; j++) {
                    var tCard = talentCards[j];
                    html += '<div class="card">';
                    html += '<div class="card-icon"><i class="fas ' + tCard.icon + '"></i></div>';
                    html += '<div class="card-body">';
                    html += '<div class="card-title">' + tCard.title + '</div>';
                    html += '<div class="card-desc">' + tCard.desc + '</div>';
                    html += '</div></div>';
                }
            }
            html += '</div></section>';

            // ---- 系统设置 ----
            html += '<section class="category-block" id="section-settings" data-category="settings">';
            html += '<div class="category-header">';
            html += '<h2 class="category-title"><i class="fas fa-cog"></i> 系统设置 <small>管理</small></h2>';
            html += '</div>';
            html += '<div class="settings-section">';
            html += '<div class="lock-banner" id="lockBanner">';
            var lockIcon = isAdmin ? 'fa-unlock' : 'fa-lock';
            var badgeClass = isAdmin ? 'unlocked-badge' : 'locked-badge';
            var badgeText = isAdmin ? '已解锁' : '已锁定';
            var statusText = isAdmin ? '✅ 您拥有管理权限' : '🔒 需要管理员密码才能编辑';
            html += '<div class="lock-text"><i class="fas ' + lockIcon + '"></i> 当前状态：<span class="' + badgeClass + '">' + badgeText +
                '</span> ' + statusText + '</div>';
            var btnIcon = isAdmin ? 'fa-lock' : 'fa-key';
            var btnText = isAdmin ? '锁定' : '解锁';
            html += '<button class="unlock-btn" id="toggleAdminBtn"><i class="fas ' + btnIcon + '"></i> ' + btnText + '</button>';
            html += '</div>';
            html += '<div class="setting-group">';
            html += '<div class="setting-label"><i class="fas fa-building" style="color:#2563eb;"></i> 所属部门管理 <small>' + (isAdmin ?
                    '（可编辑）' : '（只读）') + '</small></div>';
            html += '<div class="settings-item-list" id="deptList">';
            for (var k = 0; k < departments.length; k++) {
                var dept = departments[k];
                html += '<div class="settings-item">' + dept;
                if (isAdmin) {
                    html += '<button class="del-btn" data-dept="' + dept + '"><i class="fas fa-times"></i></button>';
                }
                html += '</div>';
            }
            html += '</div>';
            if (isAdmin) {
                html += '<div class="settings-add-row">';
                html += '<input type="text" id="newDeptInput" placeholder="输入新部门名称..." />';
                html += '<button class="btn-add" id="addDeptBtn"><i class="fas fa-plus"></i> 添加部门</button>';
                html += '</div>';
            }
            html += '</div></div></section>';

            contentContainer.innerHTML = html;

            // ============================================================
            // 绑定事件
            // ============================================================

            // 新增职位按钮
            var addJobBtn = document.getElementById('addJobBtn');
            if (addJobBtn) {
                addJobBtn.addEventListener('click', function() {
                    modalOverlay.classList.add('active');
                    document.getElementById('jobTitle').value = '';
                    document.getElementById('jobDuty').value = '';
                    document.getElementById('jobManager').value = '';
                    document.getElementById('jobDate').value = '';
                    document.getElementById('jobStatus').value = '招聘中';
                    var deptSelect = document.getElementById('jobDept');
                    renderDeptOptions(deptSelect);
                });
            }

            // 筛选按钮
            var filterApply = document.getElementById('filterApplyBtn');
            if (filterApply) filterApply.addEventListener('click', applyTalentFilter);
            var filterReset = document.getElementById('filterResetBtn');
            if (filterReset) filterReset.addEventListener('click', resetTalentFilter);

            // 筛选输入实时触发
            var filterInputs = document.querySelectorAll('#talentFilter input, #talentFilter select');
            for (var fi = 0; fi < filterInputs.length; fi++) {
                filterInputs[fi].addEventListener('input', applyTalentFilter);
                filterInputs[fi].addEventListener('change', applyTalentFilter);
            }

            // 权限切换
            var toggleBtn = document.getElementById('toggleAdminBtn');
            if (toggleBtn) toggleBtn.addEventListener('click', toggleAdmin);

            // 删除部门
            var delBtns = document.querySelectorAll('.del-btn');
            for (var d = 0; d < delBtns.length; d++) {
                delBtns[d].addEventListener('click', function() {
                    if (!isAdmin) return;
                    var deptName = this.dataset.dept;
                    if (confirm('确定要删除部门「' + deptName + '」吗？')) {
                        var newDepts = [];
                        for (var idx = 0; idx < departments.length; idx++) {
                            if (departments[idx] !== deptName) {
                                newDepts.push(departments[idx]);
                            }
                        }
                        departments = newDepts;
                        updateSettingsUI();
                        var deptSelect = document.getElementById('jobDept');
                        renderDeptOptions(deptSelect);
                        renderNavigation();
                    }
                });
            }

            // 添加部门
            var addDeptBtn = document.getElementById('addDeptBtn');
            if (addDeptBtn) {
                addDeptBtn.addEventListener('click', function() {
                    if (!isAdmin) return;
                    var input = document.getElementById('newDeptInput');
                    var name = input.value.trim();
                    if (!name) { alert('请输入部门名称'); return; }
                    for (var i = 0; i < departments.length; i++) {
                        if (departments[i] === name) { alert('该部门已存在'); return; }
                    }
                    departments.push(name);
                    input.value = '';
                    updateSettingsUI();
                    var deptSelect = document.getElementById('jobDept');
                    renderDeptOptions(deptSelect);
                    renderNavigation();
                });
            }

            var newDeptInput = document.getElementById('newDeptInput');
            if (newDeptInput) {
                newDeptInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        var btn = document.getElementById('addDeptBtn');
                        if (btn) btn.click();
                    }
                });
            }

            // 更新导航计数
            renderNavigation();
        }

        // ============================================================
        // 系统设置 UI 更新
        // ============================================================
        function updateSettingsUI() {
            var list = document.getElementById('deptList');
            if (!list) return;
            var html = '';
            for (var i = 0; i < departments.length; i++) {
                var dept = departments[i];
                html += '<div class="settings-item">' + dept;
                if (isAdmin) {
                    html += '<button class="del-btn" data-dept="' + dept + '"><i class="fas fa-times"></i></button>';
                }
                html += '</div>';
            }
            list.innerHTML = html;

            // 重新绑定删除事件
            var delBtns = document.querySelectorAll('.del-btn');
            for (var d = 0; d < delBtns.length; d++) {
                delBtns[d].addEventListener('click', function() {
                    if (!isAdmin) return;
                    var deptName = this.dataset.dept;
                    if (confirm('确定要删除部门「' + deptName + '」吗？')) {
                        var newDepts = [];
                        for (var idx = 0; idx < departments.length; idx++) {
                            if (departments[idx] !== deptName) {
                                newDepts.push(departments[idx]);
                            }
                        }
                        departments = newDepts;
                        updateSettingsUI();
                        var deptSelect = document.getElementById('jobDept');
                        renderDeptOptions(deptSelect);
                        renderNavigation();
                    }
                });
            }

            updateLockUI();
        }

        // ============================================================
        // 权限控制
        // ============================================================
        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                updateLockUI();
                updateSettingsUI();
                renderNavigation();
            } else {
                passwordModal.classList.add('active');
                adminPasswordInput.value = '';
                adminPasswordInput.focus();
            }
        }

        function updateLockUI() {
            var banner = document.getElementById('lockBanner');
            if (!banner) return;
            var lockIcon = isAdmin ? 'fa-unlock' : 'fa-lock';
            var badgeClass = isAdmin ? 'unlocked-badge' : 'locked-badge';
            var badgeText = isAdmin ? '已解锁' : '已锁定';
            var statusText = isAdmin ? '✅ 您拥有管理权限' : '🔒 需要管理员密码才能编辑';
            var btnIcon = isAdmin ? 'fa-lock' : 'fa-key';
            var btnText = isAdmin ? '锁定' : '解锁';

            banner.innerHTML = '<div class="lock-text"><i class="fas ' + lockIcon + '"></i> 当前状态：<span class="' + badgeClass +
                '">' + badgeText + '</span> ' + statusText +
                '</div><button class="unlock-btn" id="toggleAdminBtn"><i class="fas ' + btnIcon + '"></i> ' + btnText +
                '</button>';

            document.getElementById('toggleAdminBtn').addEventListener('click', toggleAdmin);
        }

        // ============================================================
        // 人才库筛选（模糊匹配）
        // ============================================================
        var filterInputsRef = {};

        function applyTalentFilter() {
            var pos = (document.getElementById('filterPosition').value || '').trim().toLowerCase();
            var name = (document.getElementById('filterName').value || '').trim().toLowerCase();
            var degree = document.getElementById('filterDegree').value;
            var exp = document.getElementById('filterExperience').value;
            var status = document.getElementById('filterStatus').value;

            var grid = document.getElementById('talentCardGrid');
            if (!grid) return;
            var cards = grid.querySelectorAll('.card');
            var emptyTip = grid.querySelector('.empty-tip');

            if (talentCards.length === 0) {
                if (!emptyTip) {
                    var tip = document.createElement('div');
                    tip.className = 'empty-tip';
                    tip.textContent = '暂无候选人';
                    grid.appendChild(tip);
                }
                return;
            }

            var hasVisible = false;
            for (var i = 0; i < cards.length; i++) {
                var card = cards[i];
                var title = card.querySelector('.card-title') ? card.querySelector('.card-title').textContent : '';
                var desc = card.querySelector('.card-desc') ? card.querySelector('.card-desc').textContent : '';
                var fullText = (title + ' ' + desc).toLowerCase();

                var show = true;
                if (pos && fullText.indexOf(pos) === -1) show = false;
                if (name && title.toLowerCase().indexOf(name) === -1) show = false;
                if (degree !== 'all' && desc.indexOf(degree) === -1) show = false;
                if (exp !== 'all') {
                    var expMap = { '应届生': '应届生', '1-3年': '1-3年', '3-5年': '3-5年', '5-10年': '5-10年', '10年以上': '10年以上' };
                    var expText = expMap[exp] || exp;
                    if (desc.indexOf(expText) === -1) show = false;
                }
                if (status !== 'all' && desc.indexOf(status) === -1) show = false;

                card.style.display = show ? '' : 'none';
                if (show) hasVisible = true;
            }

            if (!hasVisible) {
                var tipEl = grid.querySelector('.empty-tip');
                if (!tipEl) {
                    var newTip = document.createElement('div');
                    newTip.className = 'empty-tip';
                    newTip.textContent = '没有匹配的人才';
                    grid.appendChild(newTip);
                }
            } else {
                var tipEl2 = grid.querySelector('.empty-tip');
                if (tipEl2) tipEl2.remove();
            }
        }

        function resetTalentFilter() {
            document.getElementById('filterPosition').value = '';
            document.getElementById('filterName').value = '';
            document.getElementById('filterDegree').value = 'all';
            document.getElementById('filterExperience').value = 'all';
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterSource').value = 'all';
            document.getElementById('filterDateStart').value = '';
            document.getElementById('filterDateEnd').value = '';
            applyTalentFilter();
        }

        // ============================================================
        // 新增职位
        // ============================================================
        function addNewJob() {
            var title = document.getElementById('jobTitle').value.trim();
            var dept = document.getElementById('jobDept').value;
            var manager = document.getElementById('jobManager').value.trim();
            var date = document.getElementById('jobDate').value;
            var status = document.getElementById('jobStatus').value;

            if (!title) {
                alert('请输入职位名称');
                return;
            }

            var newCard = {
                title: title,
                desc: dept + ' · ' + (date || '近期') + ' · ' + status,
                icon: 'fa-briefcase'
            };
            jobCards.push(newCard);

            var grid = document.getElementById('jobCardGrid');
            if (grid) {
                var emptyTip = grid.querySelector('.empty-tip');
                if (emptyTip) emptyTip.remove();

                var cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = '<div class="card-icon"><i class="fas ' + newCard.icon + '"></i></div>' +
                    '<div class="card-body"><div class="card-title">' + newCard.title + '</div>' +
                    '<div class="card-desc">' + newCard.desc + '</div></div>';
                grid.appendChild(cardEl);
            }

            modalOverlay.classList.remove('active');
            renderNavigation();
        }

        // ============================================================
        // 滚动监听
        // ============================================================
        function updateActiveNav() {
            var sections = document.querySelectorAll('.category-block');
            var currentId = '';
            var scrollPos = window.scrollY + 100;
            for (var i = 0; i < sections.length; i++) {
                var section = sections[i];
                var top = section.offsetTop;
                var bottom = top + section.offsetHeight;
                if (scrollPos >= top && scrollPos < bottom) {
                    currentId = section.dataset.category;
                }
            }
            if (!currentId && sections.length > 0) {
                var last = sections[sections.length - 1];
                if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10) {
                    currentId = last.dataset.category;
                }
            }
            var btns = navMenu.querySelectorAll('.nav-btn');
            for (var j = 0; j < btns.length; j++) {
                var btn = btns[j];
                btn.classList.toggle('active', btn.dataset.target === currentId);
            }
        }

        function scrollToCategory(catId) {
            var target = document.getElementById('section-' + catId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setTimeout(updateActiveNav, 100);
            }
        }

        // ============================================================
        // 移动端菜单
        // ============================================================
        function openMobileMenu() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMobileMenu() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        hamburgerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (sidebar.classList.contains('open')) {
                closeMobileMenu();
            } else {
                openMobileMenu();
            }
        });

        overlay.addEventListener('click', closeMobileMenu);

        navMenu.addEventListener('click', function() {
            if (window.innerWidth <= 820) {
                setTimeout(closeMobileMenu, 120);
            }
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth > 820 && sidebar.classList.contains('open')) {
                closeMobileMenu();
            }
        });

        // ============================================================
        // 弹窗事件
        // ============================================================
        modalCancel.addEventListener('click', function() {
            modalOverlay.classList.remove('active');
        });

        modalConfirm.addEventListener('click', addNewJob);

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // ============================================================
        // 密码验证
        // ============================================================
        passwordCancel.addEventListener('click', function() {
            passwordModal.classList.remove('active');
        });

        passwordConfirm.addEventListener('click', function() {
            var input = adminPasswordInput.value.trim();
            if (input === ADMIN_PASSWORD) {
                isAdmin = true;
                passwordModal.classList.remove('active');
                updateLockUI();
                updateSettingsUI();
                renderNavigation();
            } else {
                alert('密码错误，请重试');
                adminPasswordInput.value = '';
                adminPasswordInput.focus();
            }
        });

        adminPasswordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                passwordConfirm.click();
            }
        });

        passwordModal.addEventListener('click', function(e) {
            if (e.target === passwordModal) {
                passwordModal.classList.remove('active');
            }
        });

        // ============================================================
        // 初始化
        // ============================================================
        renderNavigation();
        renderContent();

        var ticking = false;
        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(function() {
                    updateActiveNav();
                    ticking = false;
                });
                ticking = true;
            }
        });

        setTimeout(updateActiveNav, 150);
    </script>
</body>
</html>
