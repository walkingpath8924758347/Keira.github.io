<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>招聘系统 · 职位与人才库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f2f8;
            display: flex;
            min-height: 100vh;
            color: #1e1f2a;
        }

        /* ===== 左侧导航栏 ===== */
        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 280px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.03);
            padding: 32px 20px 40px 24px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
            z-index: 1000;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            color: #1e1f2a;
            letter-spacing: -0.5px;
            margin-bottom: 44px;
            padding-left: 4px;
        }

        .sidebar-logo i {
            font-size: 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-logo span {
            background: linear-gradient(135deg, #1e1f2a, #4b4c5a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border: none;
            background: transparent;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            color: #5b5c6e;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            text-align: left;
            position: relative;
        }

        .nav-btn i {
            width: 22px;
            font-size: 18px;
            color: #8b8c9e;
            transition: color 0.25s ease;
        }

        .nav-btn:hover {
            background: rgba(99, 102, 241, 0.08);
            color: #1e1f2a;
            transform: translateX(4px);
        }

        .nav-btn:hover i {
            color: #6366f1;
        }

        .nav-btn.active {
            background: rgba(99, 102, 241, 0.12);
            color: #1e1f2a;
            font-weight: 600;
            box-shadow: inset 3px 0 0 #6366f1;
        }

        .nav-btn.active i {
            color: #6366f1;
        }

        .nav-btn .badge {
            margin-left: auto;
            background: rgba(99, 102, 241, 0.12);
            color: #6366f1;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 40px;
        }

        /* 移动端汉堡菜单 */
        .hamburger {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            width: 50px;
            height: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            font-size: 22px;
            color: #1e1f2a;
            cursor: pointer;
            transition: 0.3s ease;
            align-items: center;
            justify-content: center;
        }

        .hamburger:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.04);
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            z-index: 999;
            transition: opacity 0.3s ease;
        }

        /* ===== 右侧主内容 ===== */
        .main-content {
            flex: 1;
            padding: 32px 44px 60px 44px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== 分类区块 ===== */
        .category-block {
            margin-bottom: 48px;
            scroll-margin-top: 20px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .category-title {
            font-size: 28px;
            font-weight: 700;
            color: #1e1f2a;
            letter-spacing: -0.6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-title i {
            font-size: 26px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .category-title small {
            font-weight: 400;
            font-size: 14px;
            color: #8b8c9e;
            background: rgba(139, 140, 158, 0.12);
            padding: 2px 14px;
            border-radius: 40px;
            -webkit-text-fill-color: #8b8c9e;
        }

        /* 按钮样式 */
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-outline-sm {
            background: transparent;
            border: 1px solid rgba(139, 140, 158, 0.2);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #5b5c6e;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline-sm:hover {
            background: rgba(99, 102, 241, 0.06);
            border-color: #6366f1;
            color: #6366f1;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }

        /* ===== 筛选区 (人才库) ===== */
        .filter-section {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 24px 28px;
            margin: 8px 0 28px 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }

        .filter-section:hover {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px 20px;
            align-items: end;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-item label {
            font-size: 12px;
            font-weight: 600;
            color: #8b8c9e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-item select,
        .filter-item input {
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(139, 140, 158, 0.15);
            background: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            color: #1e1f2a;
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .filter-item select:focus,
        .filter-item input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
            background: white;
        }

        .filter-item input[type="date"] {
            padding: 9px 12px;
        }

        .filter-date-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .filter-date-group input {
            flex: 1;
        }

        .filter-date-group span {
            color: #b0b1c2;
            font-size: 13px;
        }

        .filter-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 18px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(139, 140, 158, 0.08);
        }

        .filter-actions .btn {
            background: transparent;
            border: 1px solid rgba(139, 140, 158, 0.15);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #5b5c6e;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .filter-actions .btn:hover {
            background: rgba(99, 102, 241, 0.06);
            border-color: #6366f1;
            color: #6366f1;
        }

        /* ===== 卡片网格 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 4px;
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 18px 20px 18px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.02);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.08);
            border-color: rgba(99, 102, 241, 0.15);
        }

        .card-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.08));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #6366f1;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .card:hover .card-icon {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            transform: scale(1.04);
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-weight: 600;
            color: #1e1f2a;
            font-size: 15px;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }

        .card-desc {
            font-size: 13px;
            color: #8b8c9e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-tip {
            color: #b0b1c2;
            font-size: 15px;
            padding: 40px 0;
            text-align: center;
            width: 100%;
            grid-column: 1 / -1;
        }

        /* ===== 系统设置 ===== */
        .settings-section {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        .settings-section .setting-group {
            margin-bottom: 28px;
        }

        .settings-section .setting-group:last-child {
            margin-bottom: 0;
        }

        .settings-section .setting-label {
            font-size: 16px;
            font-weight: 600;
            color: #1e1f2a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-section .setting-label small {
            font-weight: 400;
            font-size: 13px;
            color: #b0b1c2;
        }

        .settings-item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .settings-item {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(139, 140, 158, 0.12);
            border-radius: 40px;
            padding: 8px 16px 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #1e1f2a;
            transition: all 0.2s ease;
        }

        .settings-item:hover {
            border-color: rgba(99, 102, 241, 0.2);
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .settings-item .del-btn {
            background: transparent;
            border: none;
            color: #b0b1c2;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 20px;
            transition: all 0.2s ease;
        }

        .settings-item .del-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
        }

        .settings-add-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .settings-add-row input {
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid rgba(139, 140, 158, 0.15);
            background: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            color: #1e1f2a;
            outline: none;
            transition: all 0.25s ease;
            min-width: 200px;
            flex: 1;
            font-family: 'Inter', sans-serif;
        }

        .settings-add-row input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
            background: white;
        }

        .settings-add-row .btn-add {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.2);
        }

        .settings-add-row .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.3);
        }

        /* 权限锁定横幅 */
        .lock-banner {
            background: rgba(251, 191, 36, 0.12);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .lock-banner .lock-text {
            font-size: 14px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lock-banner .unlock-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
        }

        .lock-banner .unlock-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .lock-banner .locked-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
        }

        .lock-banner .unlocked-badge {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px 40px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalIn {
            from {
                transform: scale(0.94) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal h3 {
            font-size: 22px;
            font-weight: 700;
            color: #1e1f2a;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.4px;
        }

        .modal .form-group {
            margin-bottom: 18px;
        }

        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #5b5c6e;
            margin-bottom: 5px;
        }

        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(139, 140, 158, 0.15);
            background: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            color: #1e1f2a;
            outline: none;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
            background: white;
        }

        .modal .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions .btn {
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .modal-actions .btn-outline {
            background: transparent;
            border: 1px solid rgba(139, 140, 158, 0.2);
            color: #5b5c6e;
        }

        .modal-actions .btn-outline:hover {
            background: rgba(99, 102, 241, 0.06);
            border-color: #6366f1;
            color: #6366f1;
        }

        .modal-actions .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.2);
        }

        .modal-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.3);
        }

        /* 密码弹窗 */
        .password-modal .modal {
            max-width: 420px;
        }

        .password-modal .form-group input {
            text-align: center;
            font-size: 18px;
            letter-spacing: 6px;
            padding: 14px;
        }

        .password-modal .form-group .hint {
            font-size: 13px;
            color: #b0b1c2;
            text-align: center;
            margin-top: 8px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .sidebar {
                transform: translateX(-110%);
                position: fixed;
                top: 0;
                left: 0;
                width: 290px;
                height: 100vh;
                box-shadow: 0 0 60px rgba(0, 0, 0, 0.06);
                border-right: none;
                background: rgba(255, 255, 255, 0.92);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .hamburger {
                display: flex;
            }

            .overlay.active {
                display: block;
            }

            .main-content {
                padding: 28px 18px 40px 18px;
            }

            .filter-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 14px;
            }

            .modal .form-row {
                grid-template-columns: 1fr;
            }

            .settings-add-row {
                flex-direction: column;
                align-items: stretch;
            }

            .category-title {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }

            .card-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .card {
                padding: 14px;
                gap: 12px;
            }

            .card-icon {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 18px;
                border-radius: 14px;
            }

            .category-title {
                font-size: 20px;
            }

            .modal {
                padding: 24px 18px;
            }

            .filter-section {
                padding: 16px 16px;
            }

            .settings-section {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><i class="fas fa-building"></i><span>招聘系统</span></div>
        <nav class="nav-menu" id="navMenu"></nav>
    </aside>

    <main class="main-content" id="mainContent">
        <div id="contentContainer"></div>
    </main>

    <!-- 新增职位弹窗 -->
    <div class="modal-overlay" id="jobModal">
        <div class="modal">
            <h3><i class="fas fa-briefcase" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></i> 新增职位</h3>
            <div class="form-group">
                <label>职位名称 *</label>
                <input type="text" id="jobTitle" placeholder="例如：前端开发工程师" />
            </div>
            <div class="form-group">
                <label>岗位职责</label>
                <textarea id="jobDuty" placeholder="描述岗位核心职责..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>所属部门 *</label>
                    <select id="jobDept"></select>
                </div>
                <div class="form-group">
                    <label>用人经理</label>
                    <input type="text" id="jobManager" placeholder="输入Lark人员名称" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>职位开设时间</label>
                    <input type="date" id="jobDate" />
                </div>
                <div class="form-group">
                    <label>职位状态</label>
                    <select id="jobStatus">
                        <option value="招聘中" selected>招聘中</option>
                        <option value="招聘截止">招聘截止</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalCancel">取消</button>
                <button class="btn btn-primary" id="modalConfirm">确认新增</button>
            </div>
        </div>
    </div>

    <!-- 密码验证弹窗 -->
    <div class="modal-overlay password-modal" id="passwordModal">
        <div class="modal">
            <h3><i class="fas fa-lock" style="background:linear-gradient(135deg,#f59e0b,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></i> 权限验证</h3>
            <div class="form-group">
                <label>请输入管理员密码</label>
                <input type="password" id="adminPassword" placeholder="请输入密码" />
                <div class="hint">默认密码：admin123</div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="passwordCancel">取消</button>
                <button class="btn btn-primary" id="passwordConfirm">验证</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 数据 ----------
            let jobCards = [];
            let talentCards = [];
            let departments = ['硬件研发部', '软件研发部', '经营管理部', '市场部', '品牌与体验部', '产品部'];
            let isAdmin = false;
            const ADMIN_PASSWORD = 'admin123';

            const categories = [
                { id: 'jobs', label: '职位管理', icon: 'fa-briefcase' },
                { id: 'talent', label: '人才库', icon: 'fa-users' },
                { id: 'settings', label: '系统设置', icon: 'fa-cog' }
            ];

            // DOM 引用
            const navMenu = document.getElementById('navMenu');
            const contentContainer = document.getElementById('contentContainer');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const modalOverlay = document.getElementById('jobModal');
            const modalCancel = document.getElementById('modalCancel');
            const modalConfirm = document.getElementById('modalConfirm');
            const passwordModal = document.getElementById('passwordModal');
            const passwordCancel = document.getElementById('passwordCancel');
            const passwordConfirm = document.getElementById('passwordConfirm');
            const adminPasswordInput = document.getElementById('adminPassword');

            let filterInputs = {};

            // ---------- 渲染导航 ----------
            function renderNavigation() {
                navMenu.innerHTML = '';
                categories.forEach((cat, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `nav-btn${idx === 0 ? ' active' : ''}`;
                    btn.dataset.target = cat.id;
                    let badge = '';
                    if (cat.id === 'jobs') badge = `<span class="badge">${jobCards.length}</span>`;
                    if (cat.id === 'talent') badge = `<span class="badge">${talentCards.length}</span>`;
                    btn.innerHTML = `<i class="fas ${cat.icon}"></i> ${cat.label} ${badge}`;
                    btn.addEventListener('click', () => {
                        scrollToCategory(cat.id);
                        closeMobileMenu();
                    });
                    navMenu.appendChild(btn);
                });
            }

            // ---------- 渲染部门下拉 ----------
            function renderDeptOptions(selectEl) {
                if (!selectEl) return;
                selectEl.innerHTML = '';
                departments.forEach(dept => {
                    const opt = document.createElement('option');
                    opt.value = dept;
                    opt.textContent = dept;
                    selectEl.appendChild(opt);
                });
            }

            // ---------- 渲染内容 ----------
            function renderContent() {
                let html = '';

                // ---- 职位管理 ----
                html += `<section class="category-block" id="section-jobs" data-category="jobs">`;
                html += `<div class="category-header">
                    <h2 class="category-title"><i class="fas fa-briefcase"></i> 职位管理 <small>分类</small></h2>
                    <button class="btn-primary" id="addJobBtn"><i class="fas fa-plus"></i> 新增职位</button>
                </div>`;
                html += `<div class="card-grid" id="jobCardGrid">`;
                if (jobCards.length === 0) {
                    html += `<div class="empty-tip">✨ 暂无职位，点击「新增职位」添加</div>`;
                } else {
                    jobCards.forEach((card, index) => {
                        html += `<div class="card" data-index="${index}">
                            <div class="card-icon"><i class="fas ${card.icon}"></i></div>
                            <div class="card-body">
                                <div class="card-title">${card.title}</div>
                                <div class="card-desc">${card.desc}</div>
                            </div>
                        </div>`;
                    });
                }
                html += `</div></section>`;

                // ---- 人才库 ----
                html += `<section class="category-block" id="section-talent" data-category="talent">`;
                html += `<div class="category-header">
                    <h2 class="category-title"><i class="fas fa-users"></i> 人才库 <small>分类</small></h2>
                </div>`;
                html += `<div class="filter-section" id="talentFilter">
                    <div class="filter-grid">
                        <div class="filter-item">
                            <label>应聘职位</label>
                            <input type="text" id="filterPosition" placeholder="输入职位关键词" />
                        </div>
                        <div class="filter-item">
                            <label>候选人姓名</label>
                            <input type="text" id="filterName" placeholder="输入姓名关键词" />
                        </div>
                        <div class="filter-item">
                            <label>最高学历</label>
                            <select id="filterDegree">
                                <option value="all">全部</option>
                                <option value="大专">大专</option>
                                <option value="本科">本科</option>
                                <option value="硕士">硕士</option>
                                <option value="博士">博士</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>工作年限</label>
                            <select id="filterExperience">
                                <option value="all">全部</option>
                                <option value="应届生">应届生</option>
                                <option value="1-3年">1-3年</option>
                                <option value="3-5年">3-5年</option>
                                <option value="5-10年">5-10年</option>
                                <option value="10年以上">10年以上</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>当前状态</label>
                            <select id="filterStatus">
                                <option value="all">全部</option>
                                <option value="在职">在职</option>
                                <option value="离职">离职</option>
                                <option value="待业">待业</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>来源渠道</label>
                            <select id="filterSource">
                                <option value="all">全部</option>
                                <option value="内推">内推</option>
                                <option value="官方网站">官方网站</option>
                                <option value="boss">boss</option>
                                <option value="猎头">猎头</option>
                                <option value="小红书">小红书</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>投递日期</label>
                            <div class="filter-date-group">
                                <input type="date" id="filterDateStart" />
                                <span>至</span>
                                <input type="date" id="filterDateEnd" />
                            </div>
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button class="btn" id="filterApplyBtn"><i class="fas fa-search"></i> 筛选</button>
                        <button class="btn" id="filterResetBtn"><i class="fas fa-undo"></i> 重置</button>
                    </div>
                </div>`;
                html += `<div class="card-grid" id="talentCardGrid">`;
                if (talentCards.length === 0) {
                    html += `<div class="empty-tip">🌟 暂无候选人</div>`;
                } else {
                    talentCards.forEach((card, index) => {
                        html += `<div class="card" data-index="${index}">
                            <div class="card-icon"><i class="fas ${card.icon}"></i></div>
                            <div class="card-body">
                                <div class="card-title">${card.title}</div>
                                <div class="card-desc">${card.desc}</div>
                            </div>
                        </div>`;
                    });
                }
                html += `</div></section>`;

                // ---- 系统设置 ----
                html += `<section class="category-block" id="section-settings" data-category="settings">`;
                html += `<div class="category-header">
                    <h2 class="category-title"><i class="fas fa-cog"></i> 系统设置 <small>管理</small></h2>
                </div>`;
                html += `<div class="settings-section">
                    <div class="lock-banner" id="lockBanner">
                        <div class="lock-text">
                            <i class="fas ${isAdmin ? 'fa-unlock' : 'fa-lock'}"></i>
                            当前状态：<span class="${isAdmin ? 'unlocked-badge' : 'locked-badge'}">${isAdmin ? '已解锁' : '已锁定'}</span>
                            ${isAdmin ? '✅ 您拥有管理权限' : '🔒 需要管理员密码才能编辑'}
                        </div>
                        <button class="unlock-btn" id="toggleAdminBtn">
                            <i class="fas ${isAdmin ? 'fa-lock' : 'fa-key'}"></i>
                            ${isAdmin ? '锁定' : '解锁'}
                        </button>
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">
                            <i class="fas fa-building" style="color:#6366f1;"></i> 所属部门管理
                            <small>${isAdmin ? '（可编辑）' : '（只读）'}</small>
                        </div>
                        <div class="settings-item-list" id="deptList">
                            ${departments.map(dept => `
                                <div class="settings-item">
                                    ${dept}
                                    ${isAdmin ? `<button class="del-btn" data-dept="${dept}"><i class="fas fa-times"></i></button>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        ${isAdmin ? `
                        <div class="settings-add-row">
                            <input type="text" id="newDeptInput" placeholder="输入新部门名称..." />
                            <button class="btn-add" id="addDeptBtn"><i class="fas fa-plus"></i> 添加部门</button>
                        </div>
                        ` : ''}
                    </div>
                </div>`;
                html += `</section>`;

                contentContainer.innerHTML = html;

                // ---- 绑定事件 ----
                document.getElementById('addJobBtn')?.addEventListener('click', () => {
                    modalOverlay.classList.add('active');
                    document.getElementById('jobTitle').value = '';
                    document.getElementById('jobDuty').value = '';
                    document.getElementById('jobManager').value = '';
                    document.getElementById('jobDate').value = '';
                    document.getElementById('jobStatus').value = '招聘中';
                    const deptSelect = document.getElementById('jobDept');
                    renderDeptOptions(deptSelect);
                });

                document.getElementById('filterApplyBtn')?.addEventListener('click', applyTalentFilter);
                document.getElementById('filterResetBtn')?.addEventListener('click', resetTalentFilter);

                document.querySelectorAll('#talentFilter input, #talentFilter select').forEach(el => {
                    el.addEventListener('input', applyTalentFilter);
                    el.addEventListener('change', applyTalentFilter);
                });

                filterInputs = {
                    position: document.getElementById('filterPosition'),
                    name: document.getElementById('filterName'),
                    degree: document.getElementById('filterDegree'),
                    experience: document.getElementById('filterExperience'),
                    status: document.getElementById('filterStatus'),
                    source: document.getElementById('filterSource'),
                    dateStart: document.getElementById('filterDateStart'),
                    dateEnd: document.getElementById('filterDateEnd'),
                };

                // 系统设置 - 权限切换
                document.getElementById('toggleAdminBtn')?.addEventListener('click', toggleAdmin);

                // 系统设置 - 删除部门
                document.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (!isAdmin) return;
                        const dept = this.dataset.dept;
                        if (confirm(`确定要删除部门「${dept}」吗？`)) {
                            departments = departments.filter(d => d !== dept);
                            updateSettingsUI();
                            // 更新职位弹窗中的下拉
                            const deptSelect = document.getElementById('jobDept');
                            renderDeptOptions(deptSelect);
                            // 更新导航badge
                            renderNavigation();
                        }
                    });
                });

                // 系统设置 - 添加部门
                document.getElementById('addDeptBtn')?.addEventListener('click', function() {
                    if (!isAdmin) return;
                    const input = document.getElementById('newDeptInput');
                    const name = input.value.trim();
                    if (!name) { alert('请输入部门名称'); return; }
                    if (departments.includes(name)) { alert('该部门已存在'); return; }
                    departments.push(name);
                    input.value = '';
                    updateSettingsUI();
                    const deptSelect = document.getElementById('jobDept');
                    renderDeptOptions(deptSelect);
                    renderNavigation();
                });

                document.getElementById('newDeptInput')?.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        document.getElementById('addDeptBtn')?.click();
                    }
                });

                // 更新导航计数
                renderNavigation();
            }

            // ---------- 更新系统设置UI ----------
            function updateSettingsUI() {
                const list = document.getElementById('deptList');
                if (!list) return;
                list.innerHTML = departments.map(dept => `
                    <div class="settings-item">
                        ${dept}
                        ${isAdmin ? `<button class="del-btn" data-dept="${dept}"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                `).join('');

                // 重新绑定删除事件
                document.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (!isAdmin) return;
                        const dept = this.dataset.dept;
                        if (confirm(`确定要删除部门「${dept}」吗？`)) {
                            departments = departments.filter(d => d !== dept);
                            updateSettingsUI();
                            const deptSelect = document.getElementById('jobDept');
                            renderDeptOptions(deptSelect);
                            renderNavigation();
                        }
                    });
                });

                // 更新锁状态
                updateLockUI();
            }

            // ---------- 权限切换 ----------
            function toggleAdmin() {
                if (isAdmin) {
                    // 锁定
                    isAdmin = false;
                    updateLockUI();
                    updateSettingsUI();
                    renderNavigation();
                } else {
                    // 弹出密码框
                    passwordModal.classList.add('active');
                    adminPasswordInput.value = '';
                    adminPasswordInput.focus();
                }
            }

            function updateLockUI() {
                const banner = document.getElementById('lockBanner');
                if (!banner) return;
                const text = banner.querySelector('.lock-text');
                const badge = text.querySelector('span');
                const btn = document.getElementById('toggleAdminBtn');

                if (isAdmin) {
                    badge.className = 'unlocked-badge';
                    badge.textContent = '已解锁';
                    text.innerHTML = `<i class="fas fa-unlock"></i> 当前状态：<span class="unlocked-badge">已解锁</span> ✅ 您拥有管理权限`;
                    btn.innerHTML = `<i class="fas fa-lock"></i> 锁定`;
                } else {
                    badge.className = 'locked-badge';
                    badge.textContent = '已锁定';
                    text.innerHTML = `<i class="fas fa-lock"></i> 当前状态：<span class="locked-badge">已锁定</span> 🔒 需要管理员密码才能编辑`;
                    btn.innerHTML = `<i class="fas fa-key"></i> 解锁`;
                }
            }

            // ---------- 人才库筛选 ----------
            function applyTalentFilter() {
                const pos = (filterInputs.position?.value || '').trim().toLowerCase();
                const name = (filterInputs.name?.value || '').trim().toLowerCase();
                const degree = filterInputs.degree?.value || 'all';
                const exp = filterInputs.experience?.value || 'all';
                const status = filterInputs.status?.value || 'all';

                const grid = document.getElementById('talentCardGrid');
                if (!grid) return;
                const cards = grid.querySelectorAll('.card');
                let emptyTip = grid.querySelector('.empty-tip');

                if (talentCards.length === 0) {
                    if (!emptyTip) {
                        const tip = document.createElement('div');
                        tip.className = 'empty-tip';
                        tip.textContent = '🌟 暂无候选人';
                        grid.appendChild(tip);
                    }
                    return;
                }

                let hasVisible = false;
                cards.forEach((card) => {
                    const title = card.querySelector('.card-title')?.textContent || '';
                    const desc = card.querySelector('.card-desc')?.textContent || '';
                    const fullText = (title + ' ' + desc).toLowerCase();

                    let show = true;
                    if (pos && !fullText.includes(pos)) show = false;
                    if (name && !title.toLowerCase().includes(name)) show = false;
                    if (degree !== 'all' && !desc.includes(degree)) show = false;
                    if (exp !== 'all') {
                        const expMap = { '应届生': '应届生', '1-3年': '1-3年', '3-5年': '3-5年', '5-10年': '5-10年', '10年以上': '10年以上' };
                        const expText = expMap[exp] || exp;
                        if (!desc.includes(expText)) show = false;
                    }
                    if (status !== 'all' && !desc.includes(status)) show = false;

                    card.style.display = show ? '' : 'none';
                    if (show) hasVisible = true;
                });

                if (!hasVisible) {
                    if (!emptyTip) {
                        const tip = document.createElement('div');
                        tip.className = 'empty-tip';
                        tip.textContent = '没有匹配的人才';
                        grid.appendChild(tip);
                    }
                } else {
                    if (emptyTip) emptyTip.remove();
                }
            }

            function resetTalentFilter() {
                if (filterInputs.position) filterInputs.position.value = '';
                if (filterInputs.name) filterInputs.name.value = '';
                if (filterInputs.degree) filterInputs.degree.value = 'all';
                if (filterInputs.experience) filterInputs.experience.value = 'all';
                if (filterInputs.status) filterInputs.status.value = 'all';
                if (filterInputs.source) filterInputs.source.value = 'all';
                if (filterInputs.dateStart) filterInputs.dateStart.value = '';
                if (filterInputs.dateEnd) filterInputs.dateEnd.value = '';
                applyTalentFilter();
            }

            // ---------- 新增职位 ----------
            function addNewJob() {
                const title = document.getElementById('jobTitle').value.trim();
                const dept = document.getElementById('jobDept').value;
                const manager = document.getElementById('jobManager').value.trim();
                const date = document.getElementById('jobDate').value;
                const status = document.getElementById('jobStatus').value;

                if (!title) {
                    alert('请输入职位名称');
                    return;
                }

                const newCard = {
                    title: title,
                    desc: `${dept} · ${date || '近期'} · ${status}`,
                    icon: 'fa-briefcase'
                };
                jobCards.push(newCard);
                const grid = document.getElementById('jobCardGrid');
                if (grid) {
                    const emptyTip = grid.querySelector('.empty-tip');
                    if (emptyTip) emptyTip.remove();

                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.innerHTML = `
                        <div class="card-icon"><i class="fas ${newCard.icon}"></i></div>
                        <div class="card-body">
                            <div class="card-title">${newCard.title}</div>
                            <div class="card-desc">${newCard.desc}</div>
                        </div>
                    `;
                    grid.appendChild(cardEl);
                }
                modalOverlay.classList.remove('active');
                renderNavigation();
            }

            // ---------- 滚动监听 ----------
            function updateActiveNav() {
                const sections = document.querySelectorAll('.category-block');
                let currentId = '';
                const scrollPos = window.scrollY + 100;
                sections.forEach(section => {
                    const top = section.offsetTop;
                    const bottom = top + section.offsetHeight;
                    if (scrollPos >= top && scrollPos < bottom) {
                        currentId = section.dataset.category;
                    }
                });
                if (!currentId && sections.length > 0) {
                    const last = sections[sections.length - 1];
                    if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10) {
                        currentId = last.dataset.category;
                    }
                }
                navMenu.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.target === currentId);
                });
            }

            function scrollToCategory(catId) {
                const target = document.getElementById(`section-${catId}`);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    setTimeout(updateActiveNav, 100);
                }
            }

            // ---------- 移动端菜单 ----------
            function openMobileMenu() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeMobileMenu() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            hamburgerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.contains('open') ? closeMobileMenu() : openMobileMenu();
            });
            overlay.addEventListener('click', closeMobileMenu);
            navMenu.addEventListener('click', () => {
                if (window.innerWidth <= 820) setTimeout(closeMobileMenu, 120);
            });
            window.addEventListener('resize', () => {
                if (window.innerWidth > 820 && sidebar.classList.contains('open')) closeMobileMenu();
            });

            // ---------- 弹窗事件 ----------
            modalCancel.addEventListener('click', () => modalOverlay.classList.remove('active'));
            modalConfirm.addEventListener('click', addNewJob);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) modalOverlay.classList.remove('active');
            });

            // ---------- 密码验证 ----------
            passwordCancel.addEventListener('click', () => passwordModal.classList.remove('active'));
            passwordConfirm.addEventListener('click', function() {
                const input = adminPasswordInput.value.trim();
                if (input === ADMIN_PASSWORD) {
                    isAdmin = true;
                    passwordModal.classList.remove('active');
                    updateLockUI();
                    updateSettingsUI();
                    renderNavigation();
                } else {
                    alert('密码错误，请重试');
                    adminPasswordInput.value = '';
                    adminPasswordInput.focus();
                }
            });
            adminPasswordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    passwordConfirm.click();
                }
            });
            passwordModal.addEventListener('click', (e) => {
                if (e.target === passwordModal) passwordModal.classList.remove('active');
            });

            // ---------- 初始化 ----------
            renderNavigation();
            renderContent();

            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => { updateActiveNav();
                        ticking = false; });
                    ticking = true;
                }
            });
            setTimeout(updateActiveNav, 150);
        })();
    </script>
</body>
</html>
